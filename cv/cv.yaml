summary: >
  Software engineer who likes coding in Rust, with professional experience
  building Rust backends on Azure and a strong background in C++, Python, and
  3D graphics. Used to regulated and security-sensitive environments through
  medical software at Mylab and defense products at Saab, with DevOps,
  CI/CD, and Linux experience. Contributor to open source (Inviwo, Bevy).
  Curious about technology overall, having built things ranging from embedded firmware to GPU
  shaders to full-stack backends. Through my own company *Ankrosoft AB* I built
  products such as a fullstack math learning app in Rust/WebAssembly and a Rust
  embedded motorcycle controller for map apps.

